{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Restaurant{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar">
        <a href="{% url 'dashboard' %}" class="navbar-brand">
            <img src="{% static 'icons/logoEmpresa.png' %}" alt="Logo"
            height="30" style="margin-right: 8px;">
            Restaurant
        </a>
        <div class="navbar-links">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'plano_mesas' %}">Mesas</a>
            <span class="navbar-user">{{ user.username }}</span>
            <a href="{% url 'logout' %}">Salir</a>
        </div>
    </nav>
    {% endif %}
    <main class="{% block main_class %}container{% endblock %}">
        {% block content %}{% endblock %}   
    </main>
</body>
</html>
